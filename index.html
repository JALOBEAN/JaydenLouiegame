<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Dojo Island Clone</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            background-color: #70c5cf;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        /* UI Overlay Styling */
        .ui-element {
            position: absolute;
            z-index: 10;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(5px);
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
            border: 2px solid rgba(255,255,255,0.5);
        }
        #instructions {
            bottom: 20px;
            left: 20px;
            font-weight: bold;
            color: #2c3e50;
        }
        #score-board {
            top: 20px;
            left: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #customizer-toggle {
            top: 20px;
            right: 20px;
            background: #ff4757;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s;
        }
        #customizer-toggle:active { transform: scale(0.95); }
        #customizer-panel {
            display: none;
            top: 80px;
            right: 20px;
            width: 240px;
            flex-direction: column;
            gap: 12px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        label {
            font-size: 11px;
            font-weight: bold;
            color: #7f8c8d;
            text-transform: uppercase;
        }
        select, input {
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #ccc;
            outline: none;
            width: 100%;
            font-weight: bold;
        }
        /* Portal Button Styling */
        #portal-ui {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }
        #portal-ui h2 { margin-top: 0; color: #9b59b6; }
        .portal-btn {
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            margin: 5px;
            transition: 0.2s;
        }
        .portal-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(155,89,182,0.4); }
        .close-btn { background: #7f8c8d; }
    </style>

    <!-- Load Three.js library from CDN -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- UI Hud Layer -->
    <div id="score-board" class="ui-element">🥥 Coconuts Collected: <span id="count">0</span></div>
    <div id="instructions" class="ui-element">🎮 WASD / Arrows to Move | Walk into Palm Trees to drop Coconuts | Step on the Purple Pad!</div>
    <button id="customizer-toggle" class="ui-element" onclick="toggleCustomizer()">🎨 Edit Monster</button>

    <!-- Avatar Customization Menu -->
    <div id="customizer-panel" class="ui-element">
        <div class="control-group">
            <label>Body Style</label>
            <select id="monsterType" onchange="updateMonsterStyle()">
                <option value="round">Mojo (Round)</option>
                <option value="tall">Clumsy (Tall Capsule)</option>
                <option value="cube">Boxy (Cube)</option>
            </select>
        </div>
        <div class="control-group">
            <label>Skin Color</label>
            <input type="color" id="monsterColor" value="#2ecc71" onchange="updateMonsterStyle()">
        </div>
        <div class="control-group">
            <label>Eye Setup</label>
            <select id="monsterEyes" onchange="updateMonsterStyle()">
                <option value="one">Cyclops Eye</option>
                <option value="two">Double Eyes</option>
            </select>
        </div>
    </div>

    <!-- Portal Travel UI Menu -->
    <div id="portal-ui">
        <h2>🌀 Portal Warp Matrix</h2>
        <p>Where would you like to travel next on Dojo Island?</p>
        <button class="portal-btn" onclick="teleportTo('spawn')">🏝️ Main Spawn Beach</button>
        <button class="portal-btn" onclick="teleportTo('grove')">🌴 Coconut Grove</button>
        <button class="portal-btn close-btn" onclick="closePortalUI()">❌ Stay Here</button>
    </div>

<script>
    // --- ENGINE SETUP ---
    let scene, camera, renderer;
    let player, playerMesh, eyeGroup;
    let keys = {};
    let coconutCount = 0;
    
    // Dynamic asset arrays
    let trees = [];
    let coconuts = [];
    let portalPad;
    let insidePortalZone = false;

    // Synth Audio Engine for sound effects without external assets
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playTone(freq, type, duration) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    function init() {
        const container = document.getElementById('canvas-container');
        
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x70c5cf); // Sky Blue
        scene.fog = new THREE.FogExp2(0x70c5cf, 0.015);

        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(40, 100, 40);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 200;
        const d = 80;
        dirLight.shadow.camera.left = -d;
        dirLight.shadow.camera.right = d;
        dirLight.shadow.camera.top = d;
        dirLight.shadow.camera.bottom = -d;
        scene.add(dirLight);

        buildWorld();
        buildPlayer();

        // Keyboard Event Bindings
        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
        window.addEventListener('resize', onWindowResize);

        animate();
    }

    // --- WORLD CONSTRUCTION ---
    function buildWorld() {
        // 1. Ocean Floor / Base Water Plane
        const waterGeo = new THREE.PlaneGeometry(2000, 2000);
        const waterMat = new THREE.MeshStandardMaterial({ color: 0x2e86de, roughness: 0.2 });
        const water = new THREE.Mesh(waterGeo, waterMat);
        water.rotation.x = -Math.PI / 2;
        water.position.y = -0.5;
        scene.add(water);

        // 2. Sand Island Base
        const islandGeo = new THREE.CylinderGeometry(90, 100, 4, 32);
        const islandMat = new THREE.MeshStandardMaterial({ color: 0xf1c40f, roughness: 0.9 });
        const island = new THREE.Mesh(islandGeo, islandMat);
        island.position.y = -1.5;
        island.receiveShadow = true;
        scene.add(island);

        // 3. Main Grass Tier Top Layer
        const grassGeo = new THREE.CylinderGeometry(80, 85, 2, 32);
        const grassMat = new THREE.MeshStandardMaterial({ color: 0x2ecc71, roughness: 0.8 });
        const grass = new THREE.Mesh(grassGeo, grassMat);
        grass.position.y = 0.5;
        grass.receiveShadow = true;
        scene.add(grass);

        // 4. Generate Interactive Palm Trees with Positions
        const treePositions = [
            {x: -25, z: -20}, {x: -35, z: 15}, {x: 30, z: -35}, 
            {x: 40, z: 25}, {x: 5, z: -45}, {x: -15, z: -40},
            {x: 45, z: -10}, {x: 10, z: 35}, {x: -20, z: 45}
        ];
        treePositions.forEach(pos => createPalmTree(pos.x, pos.z));

        // 5. Build Warp Portal Pad Zone
        const portalGeo = new THREE.CylinderGeometry(4, 4.2, 0.4, 24);
        const portalMat = new THREE.MeshStandardMaterial({ color: 0x9b59b6, emissive: 0x4a148c, roughness: 0.3 });
        portalPad = new THREE.Mesh(portalGeo, portalMat);
        portalPad.position.set(0, 1.5, -20);
        portalPad.receiveShadow = true;
        scene.add(portalPad);

        // Portal Visual Glow Ring Decoration
