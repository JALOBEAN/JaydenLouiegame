<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Dojo Island Clone</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            background-color: #70c5cf;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .ui-element {
            position: absolute;
            z-index: 10;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
            border: 2px solid rgba(255,255,255,0.5);
        }
        #instructions {
            bottom: 20px;
            left: 20px;
            font-weight: bold;
            color: #2c3e50;
        }
        #score-board {
            top: 20px;
            left: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
        }
        #customizer-toggle {
            top: 20px;
            right: 20px;
            background: #ff4757;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 12px;
        }
        #customizer-panel {
            display: none;
            top: 80px;
            right: 20px;
            width: 240px;
            flex-direction: column;
            gap: 12px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        label {
            font-size: 11px;
            font-weight: bold;
            color: #7f8c8d;
            text-transform: uppercase;
        }
        select, input {
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #ccc;
            width: 100%;
            font-weight: bold;
        }
        #portal-ui {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }
        .portal-btn {
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            margin: 5px;
        }
        .close-btn { background: #7f8c8d; }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="score-board" class="ui-element">🥥 Coconuts Collected: <span id="count">0</span></div>
    <div id="instructions" class="ui-element">🎮 WASD / Arrows to Move | Walk into Palm Trees to drop Coconuts</div>
    <button id="customizer-toggle" class="ui-element" onclick="toggleCustomizer()">🎨 Edit Monster</button>

    <div id="customizer-panel" class="ui-element">
        <div class="control-group">
            <label>Body Style</label>
            <select id="monsterType" onchange="updateMonsterStyle()">
                <option value="round">Mojo (Round)</option>
                <option value="tall">Clumsy (Tall)</option>
                <option value="cube">Boxy (Cube)</option>
            </select>
        </div>
        <div class="control-group">
            <label>Skin Color</label>
            <input type="color" id="monsterColor" value="#2ecc71" onchange="updateMonsterStyle()">
        </div>
        <div class="control-group">
            <label>Eye Setup</label>
            <select id="monsterEyes" onchange="updateMonsterStyle()">
                <option value="one">Cyclops Eye</option>
                <option value="two">Double Eyes</option>
            </select>
        </div>
    </div>

    <div id="portal-ui">
        <h2>🌀 Portal Warp Matrix</h2>
        <button class="portal-btn" onclick="teleportTo('spawn')">🏝️ Main Spawn</button>
        <button class="portal-btn" onclick="teleportTo('grove')">🌴 Coconut Grove</button>
        <button class="portal-btn close-btn" onclick="closePortalUI()">❌ Close</button>
    </div>

    <!-- Loading a reliable unpkg library version -->
    <script src="https://unpkg.com"></script>

    <script>
        // Check if Three.js loaded correctly
        if (typeof THREE === 'undefined') {
            alert("Error: The 3D Engine script failed to download. Please make sure you are online or try opening this file in a different web browser!");
        }

        let scene, camera, renderer, player, playerMesh, eyeGroup;
        let keys = {};
        let coconutCount = 0;
        let trees = [];
        let coconuts = [];
        let portalPad;
        let insidePortalZone = false;

        function init() {
            try {
                const container = document.getElementById('canvas-container');
                scene = new THREE.Scene();
                scene.background = new THREE.Color(0x70c5cf);
                scene.fog = new THREE.FogExp2(0x70c5cf, 0.015);

                camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
                
                renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.shadowMap.enabled = true;
                container.appendChild(renderer.domElement);

                // Basic Lighting
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
                scene.add(ambientLight);

                const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
                dirLight.position.set(40, 100, 40);
                dirLight.castShadow = true;
                scene.add(dirLight);

                buildWorld();
                buildPlayer();

                window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
                window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
                window.addEventListener('resize', onWindowResize);

                animate();
            } catch (err) {
                console.error("Initialization Failed:", err);
            }
        }

        function buildWorld() {
            // Sand Island
            const islandGeo = new THREE.CylinderGeometry(90, 100, 4, 32);
            const islandMat = new THREE.MeshStandardMaterial({ color: 0xf1c40f, roughness: 0.9 });
            const island = new THREE.Mesh(islandGeo, islandMat);
            island.position.y = -1.5;
            scene.add(island);

            // Grass
            const grassGeo = new THREE.CylinderGeometry(80, 85, 2, 32);
            const grassMat = new THREE.MeshStandardMaterial({ color: 0x2ecc71, roughness: 0.8 });
            const grass = new THREE.Mesh(grassGeo, grassMat);
            grass.position.y = 0.5;
            scene.add(grass);

            // Spawn Trees
            const positions = [{x: -25, z: -20}, {x: 25, z: 20}, {x: 0, z: -35}, {x: -35, z: 20}];
            positions.forEach(pos => createPalmTree(pos.x, pos.z));

            // Portal
            const portalGeo = new THREE.CylinderGeometry(4, 4.2, 0.4, 24);
            const portalMat = new THREE.MeshStandardMaterial({ color: 0x9b59b6, roughness: 0.3 });
            portalPad = new THREE.Mesh(portalGeo, portalMat);
            portalPad.position.set(0, 1.0, -20);
            scene.add(portalPad);
        }

        function createPalmTree(x, z) {
            const group = new THREE.Group();
            group.position.set(x, 1.5, z);

            const trunkGeo = new THREE.CylinderGeometry(0.6, 0.8, 7, 8);
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x795548 });
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.y = 3.5;
            group.add(trunk);

            const leavesGeo = new THREE.ConeGeometry(4, 3, 8);
            const leavesMat = new THREE.MeshStandardMaterial({ color: 0x27ae60 });
            const leaves = new THREE.Mesh(leavesGeo, leavesMat);
            leaves.position.y = 7;
            group.add(leaves);

            scene.add(group);
            trees.push({ mesh: group, x: x, z: z, hasCoconuts: true, topY: 7 });
        }

        function buildPlayer() {
            player = { x: 0, z: 15, y: 1.5, speed: 0.4, vx: 0, vz: 0 };
            playerMesh = new THREE.Group();
            playerMesh.position.set(player.x, player.y, player.z);
            scene.add(playerMesh);
            updateMonsterStyle();
        }

        function updateMonsterStyle() {
            while(playerMesh.children.length > 0) { playerMesh.remove(playerMesh.children[0]); }
            
            const mType = document.getElementById("monsterType").value;
            const mColor = document.getElementById("monsterColor").value;
            const mEyes = document.getElementById("monsterEyes").value;

            let geo = mType === 'round' ? new THREE.SphereGeometry(1.5, 16, 16) : (mType === 'tall' ? new THREE.CylinderGeometry(1, 1, 3, 16) : new THREE.BoxGeometry(2, 2, 2));
            let mat = new THREE.MeshStandardMaterial({ color: mColor });
            let body = new THREE.Mesh(geo, mat);
            body.position.y = 1.5;
            playerMesh.add(body);

            let eyeGeo = new THREE.SphereGeometry(0.3, 8, 8);
